<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goku Runner: Infinite Hover</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
    overflow: hidden;
    user-select: none;
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 50vw;
    max-width: 900px;
    max-height: 450px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
    border-radius: 4px;
    overflow: hidden;
    background-color: #000;
  }
  #game-container:fullscreen {
    max-width: none;
    max-height: none;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }
  #game-container:-webkit-full-screen {
    max-width: none;
    max-height: none;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }
  canvas {
    background-color: #1a1a2e;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #ui {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    pointer-events: none;
  }
  #score-display {
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
  }
  #high-score-display {
    color: #ffcc00;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    margin-top: 5px;
  }
  #message-display {
    color: #ffd700;
    font-size: 20px;
    margin-top: 10px;
    text-shadow: 2px 2px 0 #000;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #game-over {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    display: none;
    z-index: 10;
  }
  #game-over h1 {
    margin: 0 0 10px 0;
    font-size: 52px;
    color: #ff3333;
    text-shadow: 4px 4px 0 #000;
    letter-spacing: 2px;
  }
  #game-over p {
    font-size: 28px;
    margin: 10px 0 30px 0;
    text-shadow: 2px 2px 0 #000;
  }
  button {
    background: #e67e22;
    color: #fff;
    border: 3px solid #fff;
    padding: 15px 30px;
    font-size: 24px;
    cursor: pointer;
    font-family: inherit;
    border-radius: 8px;
    transition: all 0.2s;
    box-shadow: 0 6px 0 #d35400, 0 10px 15px rgba(0,0,0,0.5);
  }
  button:hover {
    background: #f39c12;
    transform: translateY(2px);
    box-shadow: 0 4px 0 #d35400, 0 8px 10px rgba(0,0,0,0.5);
  }
  button:active {
    transform: translateY(6px);
    box-shadow: 0 0px 0 #d35400, 0 4px 6px rgba(0,0,0,0.5);
  }
  #instructions {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    pointer-events: none;
  }
  .control-btn {
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    z-index: 20;
    position: absolute;
    top: 15px;
    transition: background 0.2s;
  }
  .control-btn:hover {
    background: rgba(255, 255, 255, 0.4);
  }
  #fullscreen-btn {
    left: 15px;
  }
  #top-right-controls {
    right: 15px;
    position: absolute;
    top: 15px;
    display: flex;
    gap: 10px;
    z-index: 20;
  }
  #top-right-controls .control-btn {
    position: relative;
    top: 0;
    left: 0;
    right: 0;
  }
  #paused-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    z-index: 15;
    pointer-events: none;
    display: none;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div id="game-container">
  <button id="fullscreen-btn" class="control-btn" title="Fullscreen">⛶</button>
  <div id="top-right-controls">
    <button id="mute-btn" class="control-btn" title="Mute">🔊</button>
    <button id="pause-btn" class="control-btn" title="Pause">⏸</button>
  </div>
  <div id="paused-overlay">PAUSED</div>

  <div id="ui">
    <div id="score-display">Score: 0</div>
    <div id="high-score-display">Best: 0</div>
    <div id="message-display">KAIOKEN!</div>
  </div>
  
  <div id="game-over">
    <h1>GAME OVER</h1>
    <p id="final-score">Score: 0</p>
    <button id="restart-btn">Try Again</button>
  </div>

  <div id="instructions">Tap SPACE or LEFT CLICK to Jump & Hover</div>

  <canvas id="gameCanvas" width="900" height="450"></canvas>
</div>

<script>
  // Web Audio API for synthesizing retro DBZ sound effects without external files
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  const sfx = {
    playJump: () => {
      if(!audioCtx || isMuted) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine'; // Quick clear swoop
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    },
    playRun: () => {
      if(!audioCtx || isMuted) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle'; // Light tap
      osc.frequency.setValueAtTime(100, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    },
    play_kaioken: () => playFormSound('sawtooth', 60, 300, 0.6),
    play_ssj: () => playFormSound('square', 150, 900, 1.0),
    play_ssj2: () => playFormSound('square', 200, 1200, 1.2),
    play_ssj3: () => playFormSound('sawtooth', 80, 1500, 1.5, 'square'),
    play_ssj4: () => playFormSound('sawtooth', 40, 200, 1.5),
    play_ssjg: () => playFormSound('sine', 400, 1500, 1.0),
    play_ssjb: () => playFormSound('triangle', 300, 1200, 1.2),
    play_ssjbk: () => playFormSound('sawtooth', 100, 1400, 1.2, 'triangle'),
    play_ui: () => playFormSound('sine', 800, 2500, 0.8),
    play_mui: () => playFormSound('sine', 1000, 3000, 1.5, 'sine'),
    playDeath: () => {
      if(!audioCtx || isMuted) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }
  };

  function playFormSound(type1, freq1, freq2, duration, type2=null) {
    if(!audioCtx || isMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type1;
    osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + Math.min(0.2, duration/2));
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
    
    if (type2) {
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.type = type2;
      osc2.frequency.setValueAtTime(freq2/2, audioCtx.currentTime);
      osc2.frequency.exponentialRampToValueAtTime(freq1, audioCtx.currentTime + duration);
      gain2.gain.setValueAtTime(0, audioCtx.currentTime);
      gain2.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
      gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc2.start();
      osc2.stop(audioCtx.currentTime + duration);
    }
  };

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score-display');
  const highScoreDisplay = document.getElementById('high-score-display');
  const messageDisplay = document.getElementById('message-display');
  const gameOverScreen = document.getElementById('game-over');
  const finalScoreDisplay = document.getElementById('final-score');
  const restartBtn = document.getElementById('restart-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const muteBtn = document.getElementById('mute-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const pausedOverlay = document.getElementById('paused-overlay');

  // Game configuration
  const GROUND_Y = 360;
  const GRAVITY = 0.55;
  const JUMP_STRENGTH = -7.5;
  
  let frames = 0;
  let nextSpawnFrame = 130;
  let score = 0;
  let bestScore = parseInt(localStorage.getItem('gokuRunnerBestScore')) || 0;
  let gameSpeed = 5;
  let isGameOver = false;
  let isPaused = false;
  let isMuted = false;
  let animationId;
  let currentFormMessage = '';
  let messageTimer = 0;

  // Game Entities
  let player;
  let obstacles = [];
  let pits = [];
  let particles = [];
  let backgroundStars = [];

  class Player {
    constructor() {
      this.width = 32;
      this.height = 46;
      this.x = 100;
      this.y = GROUND_Y - this.height;
      this.vy = 0;
      this.isGrounded = false;
      this.form = 'normal'; // normal, kaioken, ssj
      this.animTick = 0;
    }

    update() {
      this.vy += GRAVITY;
      this.y += this.vy;
      this.animTick++;

      // Prevent going off screen top
      if (this.y < 0) {
        this.y = 0;
        this.vy = 0;
      }

      // Check if player is over a pit
      let overPit = false;
      for (let pit of pits) {
        if (this.x + this.width > pit.x && this.x < pit.x + pit.width) {
          overPit = true;
          break;
        }
      }

      // Ground collision
      if (!overPit && this.y + this.height >= GROUND_Y && this.vy >= 0) {
        this.y = GROUND_Y - this.height;
        this.vy = 0;
        this.isGrounded = true;
        if (this.animTick % 10 === 0 && !isGameOver) {
          sfx.playRun();
        }
      } else {
        this.isGrounded = false;
      }

      // Falling down pit = death
      if (this.y > canvas.height + 50) {
        triggerGameOver();
      }

      // Form updates
      let nextForm = this.form;
      let msg = "";
      if (score >= 130) { nextForm = 'mui'; msg = "MASTERED ULTRA INSTINCT!"; }
      else if (score >= 100) { nextForm = 'ui'; msg = "ULTRA INSTINCT!"; }
      else if (score >= 75) { nextForm = 'ssjbk'; msg = "SSB KAIOKEN!"; }
      else if (score >= 65) { nextForm = 'ssjb'; msg = "SUPER SAIYAN BLUE!"; }
      else if (score >= 55) { nextForm = 'ssjg'; msg = "SUPER SAIYAN GOD!"; }
      else if (score >= 40) { nextForm = 'ssj4'; msg = "SUPER SAIYAN 4!"; }
      else if (score >= 30) { nextForm = 'ssj3'; msg = "SUPER SAIYAN 3!"; }
      else if (score >= 20) { nextForm = 'ssj2'; msg = "SUPER SAIYAN 2!"; }
      else if (score >= 15) { nextForm = 'ssj'; msg = "SUPER SAIYAN!"; }
      else if (score >= 5) { nextForm = 'kaioken'; msg = "KAIOKEN!"; }

      if (nextForm !== this.form && score > 0) {
        this.form = nextForm;
        showMessage(msg);
        if(sfx['play_' + this.form]) sfx['play_' + this.form]();
      }
    }

    draw(ctx) {
      // Form Configurations
      let auraColor = null, sparkChance = 0, hairColor = '#000', hairStyle = 'normal';
      let giColor = '#ff7f00', underColor = '#0000ff';
      let isSSJ4 = false;

      switch(this.form) {
        case 'kaioken': auraColor = 'rgba(255, 30, 30, 0.4)'; break;
        case 'ssj': auraColor = 'rgba(255, 255, 50, 0.5)'; sparkChance = 0.05; hairColor = '#ffd700'; hairStyle = 'ssj'; break;
        case 'ssj2': auraColor = 'rgba(255, 255, 50, 0.6)'; sparkChance = 0.15; hairColor = '#ffd700'; hairStyle = 'ssj2'; break;
        case 'ssj3': auraColor = 'rgba(255, 255, 50, 0.7)'; sparkChance = 0.25; hairColor = '#ffd700'; hairStyle = 'ssj3'; break;
        case 'ssj4': auraColor = 'rgba(255, 30, 30, 0.5)'; hairColor = '#000'; hairStyle = 'ssj4'; isSSJ4 = true; giColor = '#ff3333'; underColor = '#fada5e'; break;
        case 'ssjg': auraColor = 'rgba(255, 50, 50, 0.6)'; hairColor = '#ff3333'; hairStyle = 'normal'; break;
        case 'ssjb': auraColor = 'rgba(50, 150, 255, 0.6)'; hairColor = '#00ccff'; hairStyle = 'ssj'; break;
        case 'ssjbk': auraColor = 'rgba(255, 30, 30, 0.5)'; hairColor = '#00ccff'; hairStyle = 'ssj'; sparkChance = 0.1; break;
        case 'ui': auraColor = 'rgba(200, 200, 255, 0.5)'; hairColor = '#333333'; hairStyle = 'normal'; break;
        case 'mui': auraColor = 'rgba(255, 255, 255, 0.8)'; hairColor = '#ffffff'; hairStyle = 'ssj2'; sparkChance = 0.3; break;
      }

      // Draw Aura
      if (auraColor) {
        ctx.fillStyle = auraColor;
        let auraSize = Math.sin(this.animTick * 0.3) * 8 + 15;
        if(this.form === 'ssj3' || this.form === 'mui') auraSize += 10;
        
        ctx.beginPath();
        ctx.ellipse(this.x + this.width/2, this.y + this.height/2, this.width/2 + auraSize, this.height/2 + auraSize, 0, 0, Math.PI * 2);
        ctx.fill();

        if (this.form === 'ssjbk') {
           // Inner blue aura
           ctx.fillStyle = 'rgba(50, 150, 255, 0.6)';
           ctx.beginPath();
           ctx.ellipse(this.x + this.width/2, this.y + this.height/2, this.width/2 + auraSize - 5, this.height/2 + auraSize - 5, 0, 0, Math.PI * 2);
           ctx.fill();
        }
      }

      // Sparks
      if (sparkChance > 0 && Math.random() < sparkChance) {
        ctx.strokeStyle = (this.form === 'mui') ? '#e0e0ff' : '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let sx = this.x - 10 + Math.random() * (this.width + 20);
        let sy = this.y - 10 + Math.random() * (this.height + 20);
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + (Math.random() - 0.5) * 40, sy + (Math.random() - 0.5) * 40);
        ctx.stroke();
      }

      // Draw Retro Goku Base
      ctx.fillStyle = '#fada5e'; // Skin tone
      ctx.fillRect(this.x + 8, this.y + 10, 16, 12); // Face

      // Hair
      ctx.fillStyle = hairColor;
      ctx.beginPath();
      if (hairStyle === 'ssj' || hairStyle === 'ssj2' || hairStyle === 'mui') {
        let spikeH = hairStyle === 'ssj2' ? 25 : 18;
        if(hairStyle==='mui') spikeH = 22;
        ctx.moveTo(this.x, this.y + 12);
        ctx.lineTo(this.x - 8, this.y - 8);
        ctx.lineTo(this.x + 5, this.y + 2);
        ctx.lineTo(this.x + 8, this.y - spikeH);
        ctx.lineTo(this.x + 16, this.y - 2);
        ctx.lineTo(this.x + 24, this.y - spikeH);
        ctx.lineTo(this.x + 26, this.y + 2);
        ctx.lineTo(this.x + 40, this.y - 8);
        ctx.lineTo(this.x + 32, this.y + 12);
      } else if (hairStyle === 'ssj3') {
        ctx.moveTo(this.x + 12, this.y + 10);
        ctx.lineTo(this.x + 5, this.y - 10);
        ctx.lineTo(this.x - 5, this.y - 20);
        ctx.lineTo(this.x - 20, this.y - 15);
        ctx.lineTo(this.x - 35, this.y - 5);
        ctx.lineTo(this.x - 45, this.y + 10);
        ctx.lineTo(this.x - 40, this.y + 25);
        ctx.lineTo(this.x - 25, this.y + 35);
        ctx.lineTo(this.x - 10, this.y + 15);
        ctx.lineTo(this.x, this.y + 12);
      } else if (hairStyle === 'ssj4') {
        ctx.moveTo(this.x - 5, this.y + 20);
        ctx.lineTo(this.x - 12, this.y + 5);
        ctx.lineTo(this.x + 5, this.y - 5);
        ctx.lineTo(this.x + 20, this.y - 10);
        ctx.lineTo(this.x + 35, this.y + 5);
        ctx.lineTo(this.x + 42, this.y + 20);
        ctx.lineTo(this.x + 25, this.y + 10);
        ctx.lineTo(this.x + 10, this.y + 10);
      } else {
        // Normal Hair
        ctx.moveTo(this.x - 2, this.y + 12);
        ctx.lineTo(this.x - 12, this.y + 5);
        ctx.lineTo(this.x + 4, this.y + 2);
        ctx.lineTo(this.x + 12, this.y - 6);
        ctx.lineTo(this.x + 20, this.y + 2);
        ctx.lineTo(this.x + 34, this.y + 5);
        ctx.lineTo(this.x + 30, this.y + 12);
      }
      ctx.fill();

      // Body
      ctx.fillStyle = giColor;
      ctx.fillRect(this.x + 6, this.y + 22, 20, 14);
      
      ctx.fillStyle = underColor;
      ctx.fillRect(this.x + 10, this.y + 22, 12, 5);
      
      // If SSJ4, draw red fur on arms and tail
      if (isSSJ4) {
         ctx.fillStyle = '#ff3333';
         ctx.fillRect(this.x + 4, this.y + 22, 4, 14);
         ctx.fillRect(this.x + 24, this.y + 22, 4, 14);
         
         ctx.beginPath();
         ctx.moveTo(this.x + 6, this.y + 34);
         ctx.quadraticCurveTo(this.x - 20, this.y + 40, this.x - 15, this.y + 20);
         ctx.lineWidth = 4;
         ctx.strokeStyle = '#ff3333';
         ctx.stroke();
      }

      // Belt
      ctx.fillStyle = underColor;
      ctx.fillRect(this.x + 5, this.y + 36, 22, 4);

      // Legs / Pants
      ctx.fillStyle = giColor;
      // Animate walking if grounded
      if (this.isGrounded && !isGameOver) {
        if (Math.floor(this.animTick / 10) % 2 === 0) {
          ctx.fillRect(this.x + 6, this.y + 40, 8, 6);
          ctx.fillRect(this.x + 20, this.y + 40, 8, 6);
        } else {
          ctx.fillRect(this.x + 10, this.y + 40, 8, 6);
          ctx.fillRect(this.x + 16, this.y + 40, 8, 6);
        }
      } else {
        // Jumping legs
        ctx.fillRect(this.x + 8, this.y + 40, 8, 6);
        ctx.fillRect(this.x + 16, this.y + 38, 8, 6);
      }
    }
  }

  class Obstacle {
    constructor() {
      this.width = 45 + Math.random() * 30;
      this.x = canvas.width;
      this.type = Math.random() > 0.5 ? 'top' : 'bottom';
      this.height = 100 + Math.random() * 120; 
      if (this.type === 'top') {
        this.y = 0;
      } else {
        this.y = GROUND_Y - this.height;
      }
      this.passed = false;
      this.colorHue = Math.random() * 60 + 260; // purple-ish
    }

    update() {
      this.x -= gameSpeed;
    }

    draw(ctx) {
      let grad = ctx.createLinearGradient(this.x, this.y, this.x + this.width, this.y);
      grad.addColorStop(0, `hsl(${this.colorHue}, 100%, 40%)`);
      grad.addColorStop(0.5, `hsl(${this.colorHue}, 100%, 80%)`);
      grad.addColorStop(1, `hsl(${this.colorHue}, 100%, 40%)`);
      
      ctx.fillStyle = grad;
      ctx.fillRect(this.x, this.y, this.width, this.height);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(this.x, this.y, this.width, this.height);

      // Energy core line
      ctx.fillStyle = '#fff';
      ctx.fillRect(this.x + this.width/2 - 2, this.y, 4, this.height);
    }
  }

  class Pit {
    constructor() {
      this.width = 180 + Math.random() * 120; // Needs significant hover to cross
      this.x = canvas.width;
      this.passed = false;
    }

    update() {
      this.x -= gameSpeed;
    }

    draw(ctx) {
      // Draw void gradient
      let grad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
      grad.addColorStop(0, '#000');
      grad.addColorStop(1, '#111');
      ctx.fillStyle = grad;
      ctx.fillRect(this.x, GROUND_Y, this.width, canvas.height - GROUND_Y);

      // Lava particles effect at the bottom could be added, but simple void works well
    }
  }

  class Particle {
    constructor(x, y, color = null) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 8;
      this.vy = (Math.random() - 0.5) * 8;
      this.life = 40;
      this.maxLife = 40;
      this.color = color || (Math.random() > 0.5 ? '#fff' : '#ffcc00');
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life--;
    }

    draw(ctx) {
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
      ctx.fillRect(this.x, this.y, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  // --- Core Game Functions ---

  function jump() {
    initAudio();
    if (isGameOver || isPaused) return;
    player.vy = JUMP_STRENGTH;
    player.isGrounded = false;
    sfx.playJump();
    
    // Spawn small jump/hover particles
    particles.push(new Particle(player.x + 15, player.y + player.height, getFormColor(player.form)));
  }

  function getFormColor(form) {
    switch(form) {
      case 'kaioken': return '#ff3333';
      case 'ssj': case 'ssj2': case 'ssj3': return '#ffff33';
      case 'ssj4': return '#ff3333';
      case 'ssjg': return '#ff3333';
      case 'ssjb': case 'ssjbk': return '#00ccff';
      case 'ui': return '#e0e0e0';
      case 'mui': return '#ffffff';
      default: return '#ffffff';
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault(); // Stop scrolling
      jump();
    }
  });

  window.addEventListener('mousedown', (e) => {
    if (e.target !== restartBtn && !e.target.classList.contains('control-btn')) {
      jump();
    }
  });

  // Touch event for mobile so they don't have to wait for mousedown (which includes delay sometimes)
  window.addEventListener('touchstart', (e) => {
    if (e.target !== restartBtn && !e.target.classList.contains('control-btn')) {
      e.preventDefault(); // prevent duplicate mousedown
      jump();
    }
  }, {passive: false});

  restartBtn.addEventListener('click', () => {
    initGame();
  });

  fullscreenBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    let container = document.getElementById('game-container');
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if(container.requestFullscreen) {
        container.requestFullscreen();
      } else if(container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
    } else {
      if(document.exitFullscreen) {
        document.exitFullscreen();
      } else if(document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  });

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    isMuted = !isMuted;
    muteBtn.innerText = isMuted ? '🔇' : '🔊';
  });

  pauseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if(isGameOver) return;
    isPaused = !isPaused;
    pauseBtn.innerText = isPaused ? '▶' : '⏸';
    pausedOverlay.style.display = isPaused ? 'flex' : 'none';
    if(!isPaused) {
      updateGame();
    }
  });

  function showMessage(text) {
    messageDisplay.innerText = text;
    messageDisplay.style.opacity = 1;
    messageTimer = 120; // 2 seconds at 60fps
  }

  function initEnvironment() {
    backgroundStars = [];
    for(let i = 0; i < 70; i++) {
      backgroundStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * GROUND_Y,
        size: Math.random() * 2.5,
        speed: Math.random() * 2 + 0.5
      });
    }
  }

  function initGame() {
    player = new Player();
    obstacles = [];
    pits = [];
    particles = [];
    frames = 0;
    nextSpawnFrame = 100;
    score = 0;
    gameSpeed = 5.5;
    isGameOver = false;
    
    gameOverScreen.style.display = 'none';
    scoreDisplay.innerText = 'Score: 0';
    highScoreDisplay.innerText = 'Best: ' + bestScore;
    messageDisplay.style.opacity = 0;
    
    isPaused = false;
    pauseBtn.innerText = '⏸';
    pausedOverlay.style.display = 'none';
    
    initEnvironment();
    
    if(animationId) cancelAnimationFrame(animationId);
    updateGame();
  }

  function spawnObstacles() {
    if (frames >= nextSpawnFrame) {
      let spawnRate = Math.max(50, Math.floor(130 - score * 2.5));
      nextSpawnFrame = frames + spawnRate;
      
      // 35% chance for a pit, 65% for an energy pillar
      if (Math.random() < 0.35) {
        // Make sure previous isn't also a massive pit too close
        if (pits.length === 0 || canvas.width - (pits[pits.length-1].x + pits[pits.length-1].width) > 200) {
          pits.push(new Pit());
        }
      } else {
        obstacles.push(new Obstacle());
      }
    }
  }

  function handleCollisions() {
    // Pillars
    for (let obs of obstacles) {
      // Hitbox padding for more forgiving gameplay
      const padding = 5; 
      if (player.x + padding < obs.x + obs.width &&
          player.x + player.width - padding > obs.x &&
          player.y + padding < obs.y + obs.height &&
          player.y + player.height - padding > obs.y) {
        triggerGameOver();
      }

      // Pass logic for score
      if (obs.x + obs.width < player.x && !obs.passed) {
        obs.passed = true;
        score++;
        updateDifficulty();
      }
    }

    // Pits pass check
    for (let pit of pits) {
      if (pit.x + pit.width < player.x && !pit.passed) {
        pit.passed = true;
        score++;
        updateDifficulty();
      }
    }
  }

  function updateDifficulty() {
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('gokuRunnerBestScore', bestScore);
      highScoreDisplay.innerText = 'Best: ' + bestScore;
    }
    scoreDisplay.innerText = 'Score: ' + score;
    
    if (score >= 130) { gameSpeed = 16.0 + (score - 130) * 0.1; }
    else if (score >= 100) { gameSpeed = 14.5 + (score - 100) * 0.05; }
    else if (score >= 75) { gameSpeed = 13.0 + (score - 75) * 0.06; }
    else if (score >= 65) { gameSpeed = 12.0 + (score - 65) * 0.1; }
    else if (score >= 55) { gameSpeed = 11.0 + (score - 55) * 0.1; }
    else if (score >= 40) { gameSpeed = 10.0 + (score - 40) * 0.06; }
    else if (score >= 30) { gameSpeed = 9.0 + (score - 30) * 0.1; }
    else if (score >= 20) { gameSpeed = 8.0 + (score - 20) * 0.1; }
    else if (score >= 15) { gameSpeed = 7.5 + (score - 15) * 0.1; }
    else if (score >= 5) { gameSpeed = 6.5 + (score - 5) * 0.1; }
    else { gameSpeed = 5.5 + score * 0.2; }
  }

  function triggerGameOver() {
    if (isGameOver) return;
    isGameOver = true;
    finalScoreDisplay.innerText = 'Score: ' + score;
    gameOverScreen.style.display = 'flex';
    sfx.playDeath();

    // Massive particle explosion
    for(let i=0; i<50; i++){
      particles.push(new Particle(player.x + player.width/2, player.y + player.height/2, '#ff0000'));
      particles.push(new Particle(player.x + player.width/2, player.y + player.height/2, '#ffff00'));
    }
  }

  function updateGame() {
    if (isPaused) return;
    if (isGameOver) {
      drawGame();
      // Continue updating particles even when game over
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      if (particles.length > 0) {
        animationId = requestAnimationFrame(updateGame);
      }
      return;
    }

    frames++;
    
    // UI Messages
    if (messageTimer > 0) {
      messageTimer--;
      if (messageTimer === 0) {
        messageDisplay.style.opacity = 0;
      }
    }
    
    // Update background parallax
    for (let star of backgroundStars) {
      star.x -= star.speed * (gameSpeed / 5.5);
      if (star.x < 0) {
        star.x = canvas.width;
        star.y = Math.random() * GROUND_Y;
      }
    }

    player.update();
    spawnObstacles();

    // Move obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      obstacles[i].update();
      if (obstacles[i].x + obstacles[i].width < 0) {
        obstacles.splice(i, 1);
      }
    }

    // Move pits
    for (let i = pits.length - 1; i >= 0; i--) {
      pits[i].update();
      if (pits[i].x + pits[i].width < 0) {
        pits.splice(i, 1);
      }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // Hover trail particles
    if (!player.isGrounded && frames % 4 === 0) {
      let color = getFormColor(player.form);
      let p = new Particle(player.x + 10, player.y + player.height - 5, color);
      p.vx = -gameSpeed / 2; // Move backwards
      p.vy = Math.random() * 2; // Move slightly down
      p.life = 20; p.maxLife = 20; p.size = 3;
      particles.push(p);
    }

    handleCollisions();
    drawGame();

    animationId = requestAnimationFrame(updateGame);
  }

  function drawGame() {
    // Clear & Sky
    ctx.fillStyle = '#0f0f1b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Stars
    ctx.fillStyle = '#fff';
    for (let star of backgroundStars) {
      ctx.globalAlpha = Math.random() > 0.95 ? 0.5 : 1; // Twinkle
      ctx.fillRect(star.x, star.y, star.size, star.size);
    }
    ctx.globalAlpha = 1;

    // Base Ground
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    
    // Ground Grid Line (Retro Synthwave vibe)
    ctx.fillStyle = '#16a085';
    ctx.fillRect(0, GROUND_Y, canvas.width, 6);
    
    // Moving ground pattern
    ctx.fillStyle = '#1abc9c';
    for(let i=0; i<canvas.width; i+=40) {
      let offset = (frames * gameSpeed) % 40;
      ctx.fillRect(i - offset, GROUND_Y + 6, 20, 4);
    }

    // Pits (overwrite ground)
    for (let pit of pits) {
      pit.draw(ctx);
    }

    // Obstacles
    for (let obs of obstacles) {
      obs.draw(ctx);
    }

    // Particles
    for (let p of particles) {
      p.draw(ctx);
    }

    // Player (hide if exploded)
    if (!isGameOver) {
       player.draw(ctx);
    }
  }

  // Start the game!
  initGame();

</script>
</body>
</html>
